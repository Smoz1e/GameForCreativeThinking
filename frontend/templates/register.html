<!DOCTYPE html>
<html lang="ru">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="/static/register.css">
	<title>Регистрация игрока</title>
</head>
<body>
	<main class="register-page">
		<section class="register-card" aria-label="Регистрация игрока">
			<div class="register-header">
				<p class="eyebrow">Career Map</p>
				<h1>Регистрация игрока</h1>
				<p class="subtitle">Создайте профиль, чтобы войти в сессию и начать игру.</p>
			</div>

			<form class="register-form" id="registerForm">
				<label class="field">
					<span>Имя</span>
					<input type="text" name="name" placeholder="Введите имя" autocomplete="name" required>
				</label>

				<label class="field">
					<span id="sessionKeyLabel">Ключь к сесии</span>
					<input type="text" name="session_key" placeholder="Введите ключ сессии" autocomplete="off" required>
				</label>

				<button type="submit" class="primary-button" id="registerButton">Зарегистрироваться</button>
				<button type="button" class="secondary-button" id="createGameButton">Создать игру</button>
			</form>
		</section>
	</main>
	<script>
		const registerForm = document.getElementById('registerForm');
		const registerButton = document.getElementById('registerButton');
		const createGameButton = document.getElementById('createGameButton');
		const sessionKeyLabel = document.getElementById('sessionKeyLabel');
		const sessionKeyInput = registerForm.querySelector('input[name="session_key"]');
		const joinModeButtonText = 'Создать игру';
		const createModeButtonText = 'Присоедениться к игре';
		const joinModeLabelText = 'Ключь к сесии';
		const createModeLabelText = 'Придумай ключь к сессии';
		const registerEndpoint = '/api/games/create';
		const joinEndpoint = '/api/games/join';

		function setMode(mode) {
			const isJoinMode = mode === 'join';

			registerForm.dataset.mode = mode;
			createGameButton.textContent = isJoinMode ? joinModeButtonText : 'Вернуться к присоединению';
			sessionKeyLabel.textContent = isJoinMode ? joinModeLabelText : createModeLabelText;
			sessionKeyInput.required = isJoinMode;
			sessionKeyInput.value = '';
			sessionKeyInput.placeholder = isJoinMode ? 'Введите ключ сессии' : 'Ключ будет создан автоматически';
			registerButton.textContent = isJoinMode ? 'Присоедениться к игре' : 'Создать игру';
		}

		createGameButton.addEventListener('click', () => {
			setMode(registerForm.dataset.mode === 'join' ? 'create' : 'join');
		});

		setMode('join');

		registerForm.addEventListener('submit', async (event) => {
			event.preventDefault();

			const formData = new FormData(registerForm);
			const name = String(formData.get('name') || '').trim();
			const sessionKey = String(formData.get('session_key') || '').trim();
			const mode = registerForm.dataset.mode || 'create';

			if (!name) {
				return;
			}

			const payload = mode === 'join'
				? { username: name, game_key: sessionKey }
				: { owner_name: name };

			const response = await fetch(mode === 'join' ? joinEndpoint : registerEndpoint, {
				method: 'POST',
				headers: {
					'Content-Type': 'application/json',
				},
				body: JSON.stringify(payload),
			});

			if (!response.ok) {
				const errorData = await response.json().catch(() => ({}));
				alert(errorData.detail || 'Не удалось создать или присоединиться к игре');
				return;
			}

			const result = await response.json();
			localStorage.setItem('game_key', result.game_key);
			localStorage.setItem('player_name', name);
			window.location.href = '/cart';
		});
	</script>
</body>
</html>
